# Flathub submission manifest for Loukai Karaoke.
#
# This builds FROM SOURCE with NO network access (Flathub requirement):
#  - all npm/electron artifacts come from generated-sources.json
#    (regenerate with: flatpak-node-generator npm package-lock.json)
#  - npm runs fully offline (npm_config_offline=true, cache under flatpak-node/)
#
# NOTE: this is the Flathub-from-source manifest. It is separate from the
# electron-builder `flatpak` target in package.json (which produces a local
# sideloadable .flatpak). Keep the runtime/base versions in sync between them.
#
# The Creator runs entirely in-browser (WebGPU/WASM — no Python, PyTorch, or
# system ffmpeg). Its JS/wasm assets (~80MB, pinned in webgpuAssets.js ASSETS)
# are vendored into static/webgpu by scripts/vendor-webgpu-assets.js during
# `npm run build:all`; that script is offline-tolerant, so THIS offline build
# skips them and the app falls back to its runtime fetch+cache. To ship them in
# the Flathub build, add the pinned URLs as sources dropped into static/webgpu.
# ML models (~840MB) are always fetched+cached at runtime (too big to bundle).
app-id: com.loukai.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: loukai
separate-locales: false
finish-args:
  # Display
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # Chromium/Electron needs the session bus (also used by the notifications portal).
  - --socket=session-bus
  # Audio (required for karaoke playback)
  - --socket=pulseaudio
  # Network (web remote-control server + Socket.IO)
  - --share=network
  # Song library access. NOTE: reviewers scrutinize --filesystem=home; the
  # M1.9 task narrows this toward a portal / xdg-config scope where feasible.
  - --filesystem=home
  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: loukai
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        # Offline npm — no network during build.
        npm_config_offline: 'true'
        npm_config_cache: /run/build/loukai/flatpak-node/npm-cache
        NPM_CONFIG_LOGLEVEL: info
        # electron-builder must not fetch Electron; the base app provides it and
        # generated-sources.json supplies the cached binary.
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        ELECTRON_CACHE: /run/build/loukai/flatpak-node/cache/electron
    build-commands:
      # Install npm deps fully offline from the pre-generated cache.
      - npm install --offline --no-audit --no-fund
      # Build renderer + web bundles.
      - npm run build:all
      # Package the unpacked Electron app (no installer target; 'dir' only).
      - npx --offline electron-builder --linux dir --config.npmRebuild=false
      # Stage the packaged app into the Flatpak prefix.
      - cp -r dist/linux-unpacked /app/loukai
      # Launcher: route through zypak so Chromium's sandbox maps onto Flatpak's.
      - install -Dm755 flatpak/loukai-launcher.sh /app/bin/loukai
      # Desktop entry, icon, and AppStream metainfo.
      - install -Dm644 com.loukai.app.desktop /app/share/applications/com.loukai.app.desktop
      - install -Dm644 static/images/logo-512.png /app/share/icons/hicolor/512x512/apps/com.loukai.app.png
      - install -Dm644 com.loukai.app.metainfo.xml /app/share/metainfo/com.loukai.app.metainfo.xml
    sources:
      - type: git
        url: https://github.com/monteslu/loukai.git
        tag: v0.6.0
        # Pin the exact commit (Flathub requires it). Update on each release.
        commit: 329539a1c28c82a3fe38a5ef4397f79b7a77e495
      # Generated by flatpak-node-generator from package-lock.json — declares
      # every npm tarball + the Electron binary with pinned checksums.
      - generated-sources.json
      # NOTE: the creator (stem separation + transcription) runs entirely in-browser
      # via WebGPU — NO Python/PyTorch is bundled. AAC encoding uses ffmpeg-wasm
      # (no system ffmpeg); its wasm + the other creator JS assets are fetched at
      # runtime via the webgpuAssets proxy unless vendored (see header note).
